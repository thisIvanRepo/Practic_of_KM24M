[build-system]
requires = ["setuptools", "wheel", "prompt_toolkit==3.0.47", "wcwidth==0.2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant_team_08"
version = "0.0.1"
authors = [
    { name="Ivan Popovych" },
    { name="Denys Almazov" },
    { name="Vladyslav Lypivets" },
]
description = "CLI assistant for managing contacts"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
